name: Notion → website

on:
  schedule:
    - cron: "7,37 * * * *"   # elk halfuur
  workflow_dispatch:         # knop "Run workflow" om meteen te publiceren

permissions:
  contents: write
  models: read     # GitHub Models: automatische vertaling naar het Engels en het Frans, zonder extra sleutel

concurrency:
  group: notion-website
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # leeg = niet publiceren
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5 jsdom@25
      - run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          AGENDA_DB: ${{ secrets.AGENDA_DB }}
          PRODUCTIES_DB: ${{ secrets.PRODUCTIES_DB }}
          BEELDBANK_DB: ${{ secrets.BEELDBANK_DB }}
      - name: Over WESP uit Notion
        continue-on-error: true
        run: node scripts/sync-wesp.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - run: node scripts/build-pages.mjs
        env:
          SITE_URL: https://www.merodefestival.be
      - name: Ontbrekende teksten aanvullen in Notion
        continue-on-error: true
        run: node scripts/vul-teksten.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Vertalen naar het Engels en het Frans
        continue-on-error: true    # lukt het niet, dan blijft wat nog niet vertaald is voorlopig Nederlands
        run: node scripts/vertaal.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optioneel: dan vertaalt Claude in plaats van GitHub Models
      - name: Engelse en Franse versie bouwen
        continue-on-error: true    # mislukt dit, dan gaat de Nederlandse site toch online
        run: node scripts/build-talen.mjs
        env:
          SITE_URL: https://www.merodefestival.be
      - name: Wijzigingen bewaren
        run: |
          git config user.name "website-bot"
          git config user.email "website-bot@users.noreply.github.com"
          git add site vertalingen
          git diff --cached --quiet || (git commit -m "Update uit Notion" && (git push || (git pull --rebase && git push)))
      - name: Publiceren op Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: c423358781eab80a7957babc4cec886b
